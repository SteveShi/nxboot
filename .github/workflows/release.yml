name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: SteveShi/setup-xcode@v2
        with:
          xcode-version: 'latest-stable'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Project
        run: xcodegen generate

      - name: Build and Archive
        run: |
          xcodebuild archive \
            -scheme NXBootApp \
            -configuration Release \
            -archivePath NXBoot.xcarchive \
            -destination "platform=macOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package App (Universal and arm64)
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ] && [ -f CHANGELOG.md ]; then
            VERSION=$(sed -n '/## \[/p' CHANGELOG.md | head -n 1 | cut -d'[' -f2 | cut -d']' -f1)
          fi
          if [ -z "$VERSION" ]; then
            VERSION="2.2.1"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          mkdir -p build/Universal build/arm64
          cp -R NXBoot.xcarchive/Products/Applications/NXBoot.app build/Universal/
          codesign --force --deep --sign - build/Universal/NXBoot.app
          
          # 1. Universal ZIP & DMG
          cd build/Universal
          zip -qy -r "$GITHUB_WORKSPACE/NXBoot-${VERSION}-universal.zip" NXBoot.app
          cd "$GITHUB_WORKSPACE"
          
          mkdir -p dmg_root_universal
          cp -R build/Universal/NXBoot.app dmg_root_universal/
          hdiutil create -volname "NXBoot" -srcfolder dmg_root_universal -ov -format UDZO "NXBoot-${VERSION}-universal.dmg"
          rm -rf dmg_root_universal

          # 2. arm64 Thinning & Signing
          cp -R build/Universal/NXBoot.app build/arm64/
          lipo -thin arm64 build/arm64/NXBoot.app/Contents/MacOS/NXBoot -output build/arm64/NXBoot.app/Contents/MacOS/NXBoot
          if [ -f "build/arm64/NXBoot.app/Contents/MacOS/nxboot" ]; then
            lipo -thin arm64 build/arm64/NXBoot.app/Contents/MacOS/nxboot -output build/arm64/NXBoot.app/Contents/MacOS/nxboot 2>/dev/null || true
          fi
          codesign --force --deep --sign - build/arm64/NXBoot.app

          # arm64 ZIP & DMG
          cd build/arm64
          zip -qy -r "$GITHUB_WORKSPACE/NXBoot-${VERSION}-arm64.zip" NXBoot.app
          cd "$GITHUB_WORKSPACE"
          
          mkdir -p dmg_root_arm64
          cp -R build/arm64/NXBoot.app dmg_root_arm64/
          hdiutil create -volname "NXBoot" -srcfolder dmg_root_arm64 -ov -format UDZO "NXBoot-${VERSION}-arm64.dmg"
          rm -rf dmg_root_arm64

      - name: Extract Release Notes
        id: release_notes
        run: |
          # Try to get the latest version's notes from CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            # Extract content between the first two ## headers (latest version)
            awk '/^## \[[0-9]/{if(++count==2) exit; if(count==1) next} count==1' CHANGELOG.md > changelog.txt
          else
            git log -n 10 --pretty=format:"* %s" > changelog.txt
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            NXBoot-*-universal.zip
            NXBoot-*-universal.dmg
            NXBoot-*-arm64.zip
            NXBoot-*-arm64.dmg
          body_path: changelog.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (Manual Run)
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: NXBoot-Build
          path: |
            NXBoot-*-universal.zip
            NXBoot-*-universal.dmg
            NXBoot-*-arm64.zip
            NXBoot-*-arm64.dmg
